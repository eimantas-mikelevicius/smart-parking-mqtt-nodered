<style>
  .sp-zone { margin-bottom:10px; }
  .sp-zt { font-weight:600; margin-bottom:6px; }
  .sp-tiles { display:flex; flex-wrap:wrap; gap:8px; }
  .sp-tile { width:88px; border-radius:8px; padding:6px 4px; text-align:center; color:#fff; font-size:15px; font-weight:600; }
  .sp-tile small { display:block; font-weight:400; font-size:11px; opacity:.95; }
  .sp-tile.free { background:#2e7d32; } .sp-tile.occupied { background:#c62828; }
  .sp-tile.unknown { background:#9e9e9e; }
  .sp-tile.offline { background:repeating-linear-gradient(45deg,#616161,#616161 6px,#757575 6px,#757575 12px); }
  .sp-tile.lowb { outline:3px solid #ffb300; }
</style>
<div ng-repeat="z in msg.payload.zones" class="sp-zone">
  <div class="sp-zt">Zone {{z.zone}} &mdash; {{z.free}} free, {{z.occupied}} occupied, {{z.offline}} offline</div>
  <div class="sp-tiles">
    <div class="sp-tile" ng-repeat="s in msg.payload.spots | filter:{zone:z.zone}:true"
         ng-class="[s.state, (s.battery !== null && s.battery < 15) ? 'lowb' : '']">
      {{s.id}}<small>{{s.state}}</small><small ng-if="s.battery !== null">battery {{s.battery | number:0}} %</small>
    </div>
  </div>
</div>
