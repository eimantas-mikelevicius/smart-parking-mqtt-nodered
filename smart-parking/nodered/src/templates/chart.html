<style>
  .ch-legend { display:flex; flex-wrap:wrap; gap:18px; font-size:13px; margin:2px 0 4px 42px; }
  .ch-legend i { display:inline-block; width:22px; height:4px; margin-right:6px; vertical-align:middle; border-radius:2px; }
  .ch-svg text { font-size:11px; fill:#666; font-family:inherit; }
  .ch-empty { color:#888; font-size:13px; padding:20px 0; text-align:center; }
</style>
<div ng-if="msg.payload">
  <div class="ch-legend">
    <span ng-repeat="l in msg.payload.lines"><i ng-style="{background:l.color}"></i>{{l.name}}: <b>{{l.last | number:0}} %</b></span>
    <span style="color:#888" ng-if="msg.payload.day">Simulated day {{msg.payload.day}} (UTC)</span>
  </div>
  <div class="ch-empty" ng-if="msg.payload.empty">Waiting for data...</div>
  <svg class="ch-svg" viewBox="0 0 900 300" style="width:100%;height:auto;display:block" ng-if="!msg.payload.empty">
    <g ng-repeat="y in msg.payload.yticks">
      <line ng-attr-x1="{{msg.payload.L}}" ng-attr-x2="{{msg.payload.W - msg.payload.R}}" ng-attr-y1="{{y.y}}" ng-attr-y2="{{y.y}}" stroke="#e3e3e3" stroke-width="1"></line>
      <text ng-attr-x="{{msg.payload.L - 6}}" ng-attr-y="{{y.y + 4}}" text-anchor="end">{{y.label}}</text>
    </g>
    <g ng-repeat="x in msg.payload.xticks">
      <line ng-attr-x1="{{x.x}}" ng-attr-x2="{{x.x}}" ng-attr-y1="{{msg.payload.T}}" ng-attr-y2="{{msg.payload.H - msg.payload.B}}" stroke="#f0f0f0" stroke-width="1"></line>
      <text ng-attr-x="{{x.x}}" ng-attr-y="{{msg.payload.H - 10}}" text-anchor="middle">{{x.label}}</text>
    </g>
    <polyline ng-repeat="l in msg.payload.lines" ng-attr-points="{{l.points}}" fill="none" ng-attr-stroke="{{l.color}}"
              ng-attr-stroke-width="{{l.width}}" ng-attr-stroke-dasharray="{{l.dash}}" stroke-linejoin="round"></polyline>
  </svg>
</div>
