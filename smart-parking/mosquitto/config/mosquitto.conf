# Eclipse Mosquitto 2.x - smart parking
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883 0.0.0.0
# Mokymosi projektui - anoniminiai klientai (Mosquitto 2.x kitaip neleistų prisijungti iš išorės)
allow_anonymous true
