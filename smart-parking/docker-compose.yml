services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-parking-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  nodered:
    build: ./nodered          
    container_name: smart-parking-nodered
    ports:
      - "1880:1880"
    environment:
      - TZ=UTC
      - MQTT_HOST=mosquitto   
    volumes:
      - ./nodered/data:/data  
    depends_on:
      - mosquitto
    restart: unless-stopped
